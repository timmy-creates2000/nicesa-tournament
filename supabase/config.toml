# Supabase local development configuration
# Run `supabase start` to start the local stack

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # Only admins can be created; students use anon RPC
double_confirm_changes = true
enable_secure_email_change = true

[auth.email]
enable_signup = false
enable_confirmations = true

[functions]
# Edge Functions are in supabase/functions/
